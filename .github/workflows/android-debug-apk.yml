name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure stable debug keystore exists in repository
        run: |
          if [ ! -f app/debug.keystore ]; then
            mkdir -p app
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f app/debug.keystore
            git commit -m "chore: add signing keystore [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare versioned APK file
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Debug APK not found"
            exit 1
          fi
          cp "$APK_SOURCE" "ScreenRecorder-v${{ github.run_number }}.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-v${{ github.run_number }}
          path: ScreenRecorder-v${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE="ScreenRecorder-v${{ github.run_number }}.apk"
          RELEASE_TAG="latest"
          RELEASE_TITLE="Screen Recorder v1.0.${{ github.run_number }}"
          RELEASE_NOTES="Automated debug build v1.0.${{ github.run_number }} (versionCode ${{ github.run_number }}) signed with the repository's persistent debug keystore."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$RELEASE_TAG" -m "$RELEASE_TITLE"
          git push origin "$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for asset in $EXISTING_ASSETS; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
            done
            gh release upload "$RELEASE_TAG" "$APK_FILE" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi
